# Site config for an nginx installed on the Docker host (not the compose
# `nginx` service). Same routes as default.conf, but upstreams are the ports
# compose publishes on localhost.
#
#   sudo cp nginx/host-site.conf /etc/nginx/sites-available/dating-coach
#   sudo ln -sf /etc/nginx/sites-available/dating-coach /etc/nginx/sites-enabled/dating-coach
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # Overwrite, never append: the API keys auth rate limits on the first
    # X-Forwarded-For value, so a caller-supplied header must not survive.
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_read_timeout 1h;

    location /api/    { proxy_pass http://127.0.0.1:8080; }
    location /healthz { proxy_pass http://127.0.0.1:8080; }
    location /ml/     { proxy_pass http://127.0.0.1:8000/; }

    location = / { return 200 'dating-coach gateway: /api/v1, /healthz, /ml/healthz\n'; add_header Content-Type text/plain; }
}
