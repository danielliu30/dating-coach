# Site config for an nginx installed on the Docker host (not the compose
# `nginx` service). Same routes as default.conf, but upstreams are the ports
# compose publishes on localhost. The `web` image needs `--profile gateway`;
# if you change WEB_PORT in .env, change the `location /` upstream below too.
#
# TLS is terminated here with a Let's Encrypt certificate. Replace every
# `example.com` with your domain, then:
#
#   sudo apt-get install -y nginx certbot python3-certbot-nginx
#   sudo certbot certonly --nginx -d example.com     # while nginx still serves its default :80 site;
#                                                    # writes /etc/letsencrypt/live/example.com/{fullchain,privkey}.pem
#   sed 's/example.com/<domain>/g' nginx/host-site.conf | sudo tee /etc/nginx/sites-available/dating-coach >/dev/null
#   sudo ln -sf /etc/nginx/sites-available/dating-coach /etc/nginx/sites-enabled/dating-coach
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo systemctl status certbot.timer              # auto-renewal (twice daily); `sudo certbot renew --dry-run` to test
#
# The 443 block fails `nginx -t` until the certificate files exist, hence
# certbot runs before this site is enabled. Renewals reload nginx through
# /etc/letsencrypt/renewal-hooks/deploy/ (see README "HTTPS").
# WebSocket clients carry their JWT in ?token= (they cannot set headers), so the
# /ws locations log $uri, never $request_uri, to keep the token out of the log.
log_format ws_redacted '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                   '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Port 80: ACME http-01 challenges for certbot, everything else -> HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: blob: https://images.unsplash.com; font-src 'self' data:; connect-src 'self' ws://$http_host wss://$http_host http://localhost:8080 ws://localhost:8080 https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; form-action 'self';" always;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name example.com;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: blob: https://images.unsplash.com; font-src 'self' data:; connect-src 'self' ws://$http_host wss://$http_host http://localhost:8080 ws://localhost:8080 https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; form-action 'self';" always;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Content-Security-Policy;
    client_max_body_size 1m;
    error_page 413 = @body_too_large;
    location @body_too_large {
        default_type application/json;
        return 413 '{"error":"request body too large"}';
    }

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Optional trusted-proxy config; without it, keep the direct client IP.
    include /etc/nginx/dating-coach-cloudflare/*.conf;

    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;  # keep the port: the API compares WS Origin to Host
    proxy_set_header X-Real-IP         $remote_addr;
    # Overwrite client-supplied forwarding headers at this ingress.
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_read_timeout 1h;   # keep chat sockets open

    location /api/    { proxy_pass http://127.0.0.1:8080; }
    location = /api/v1/analysis/conversations {
        client_max_body_size 16m;
        proxy_pass http://127.0.0.1:8080;
    }
    location ~ ^/api/.*/ws$ { access_log /var/log/nginx/access.log ws_redacted; proxy_pass http://127.0.0.1:8080; }
    location /healthz { proxy_pass http://127.0.0.1:8080; }
    location /ml/     { proxy_pass http://127.0.0.1:8000/; }
    location = /ml/analyze/images {
        client_max_body_size 10m;
        proxy_pass http://127.0.0.1:8000/analyze/images;
    }

    location /        { proxy_pass http://127.0.0.1:3000; }
}
