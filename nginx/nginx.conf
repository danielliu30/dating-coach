# Public entrypoint: the only port exposed by docker-compose. Routes the API
# (REST + chat WebSocket) to `api` and everything else to the static `web` image.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream api_upstream {
    server api:8080;
}

upstream web_upstream {
    server web:80;
}

server {
    listen 80;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /healthz {
        proxy_pass http://api_upstream;
    }

    # Chat WebSocket: /api/v1/chat/threads/{id}/ws needs the Upgrade handshake
    # forwarded and a long read timeout so idle sockets are not cut off.
    location ~ ^/api/v1/chat/threads/[^/]+/ws$ {
        proxy_pass http://api_upstream;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://api_upstream;
    }

    location / {
        proxy_pass http://web_upstream;
    }
}
