# Single public entrypoint for the containerised stack.
#   /api/, /healthz  -> api (Go, :8080), WebSocket upgrades pass through
#   /ml/             -> ml-analyzer (FastAPI, :8000), prefix stripped
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream api         { server api:8080; }
upstream ml_analyzer { server ml-analyzer:8000; }

server {
    listen 80;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_read_timeout 1h;   # keep chat sockets open

    location /api/    { proxy_pass http://api; }
    location /healthz { proxy_pass http://api; }
    location /ml/     { proxy_pass http://ml_analyzer/; }

    location = / { return 200 'dating-coach gateway: /api/v1, /healthz, /ml/healthz\n'; add_header Content-Type text/plain; }
}
