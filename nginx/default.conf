# Single public entrypoint for the containerised stack.
#   /api/, /healthz  -> api (Go, :8080), WebSocket upgrades pass through
#   /ml/             -> ml-analyzer (FastAPI, :8000), prefix stripped
#   /                -> web (static Expo bundle, SPA fallback handled there)
# Upstreams are held in variables so nginx re-resolves the service names via
# Docker's embedded DNS instead of pinning the container IP seen at startup.
# WebSocket clients carry their JWT in ?token= (they cannot set headers), so the
# /ws locations log $uri, never $request_uri, to keep the token out of the log.
log_format ws_redacted '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                   '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

# Metrics edge log: the metering service aggregates this into request
# count/status buckets so they come from the in-path proxy rather than
# per-request middleware in the app. $uri (never $request_uri) keeps the WS
# ticket out of the log. Buffered writes keep logging off the request path.
log_format metrics_json escape=json '{"time":"$time_iso8601","uri":"$uri","status":"$status","rt":"$request_time"}';

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: blob: https://images.unsplash.com; font-src 'self' data:; connect-src 'self' ws://$http_host wss://$http_host http://localhost:8080 ws://localhost:8080 https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; form-action 'self';" always;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Content-Security-Policy;
    client_max_body_size 1m;
    error_page 413 = @body_too_large;
    location @body_too_large {
        default_type application/json;
        return 413 '{"error":"request body too large"}';
    }

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api         http://api:8080;
    set $ml_analyzer http://ml-analyzer:8000;
    set $web         http://web:80;
    set $metering    http://metering:9090;

    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;  # keep the port: the API compares WS Origin to Host
    proxy_set_header X-Real-IP         $remote_addr;
    # Overwrite client-supplied forwarding headers at this ingress.
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_read_timeout 1h;   # keep chat sockets open

    access_log /logs/metrics-access.log metrics_json buffer=64k flush=5s;

    location /api/    { proxy_pass $api; }
    location = /api/v1/analysis/conversations {
        client_max_body_size 16m;
        proxy_pass $api;
    }
    location ~ ^/api/.*/ws$ { access_log /var/log/nginx/access.log ws_redacted; access_log /logs/metrics-access.log metrics_json buffer=64k flush=5s; proxy_pass $api; }
    location /healthz { proxy_pass $api; }
    location /ml/     { rewrite ^/ml/(.*)$ /$1 break; proxy_pass $ml_analyzer; }
    location = /ml/analyze/images {
        client_max_body_size 10m;
        rewrite ^/ml/(.*)$ /$1 break;
        proxy_pass $ml_analyzer;
    }

    # Admin-gated ops dashboard: auth_request forwards the client's bearer
    # token to the api's admin check, then everything under /metrics/ proxies
    # to the metering service (dashboard + /api/snapshot).
    location = /metrics/auth {
        internal;
        proxy_pass $api/api/v1/admin/coaches;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }
    location = /metrics { return 308 /metrics/; }
    location /metrics/ {
        auth_request /metrics/auth;
        rewrite ^/metrics/(.*)$ /$1 break;
        proxy_pass $metering;
        add_header Cache-Control "no-store" always;
    }

    location /        { proxy_pass $web; }
}
