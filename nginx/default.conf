# Single public entrypoint for the containerised stack.
#   /api/, /healthz  -> api (Go, :8080), WebSocket upgrades pass through
#   /ml/             -> ml-analyzer (FastAPI, :8000), prefix stripped
#   /                -> web (static Expo bundle, SPA fallback handled there)
# Upstreams are held in variables so nginx re-resolves the service names via
# Docker's embedded DNS instead of pinning the container IP seen at startup.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api         http://api:8080;
    set $ml_analyzer http://ml-analyzer:8000;
    set $web         http://web:80;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # Overwrite, never append: the API keys auth rate limits on the first
    # X-Forwarded-For value, so a caller-supplied header must not survive.
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_read_timeout 1h;   # keep chat sockets open

    location /api/    { proxy_pass $api; }
    location /healthz { proxy_pass $api; }
    location /ml/     { rewrite ^/ml/(.*)$ /$1 break; proxy_pass $ml_analyzer; }

    location /        { proxy_pass $web; }
}
