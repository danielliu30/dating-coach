# Load-test-only overrides. Apply with:
#   docker compose --env-file loadtest/.env -f docker-compose.yml \
#     -f loadtest/docker-compose.override.yml --profile gateway up -d --build
#
# - postgres gets pg_stat_statements preloaded (harness.DBStats diffs it per
#   scenario) and statement logging at 200ms so the slowest queries land in
#   `docker compose logs postgres`.
# - api/worker get host.docker.internal so the backend can reach the fake
#   Stripe the lt-payments driver runs on the host (STRIPE_BASE_URL).

services:
  postgres:
    command: >-
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c log_min_duration_statement=200

  api:
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker:
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # api-pay/worker-pay mirror the stack's api/worker with payments enabled and
  # Stripe pointed at the FakeStripe the lt-payments driver runs on the host.
  # They share postgres/redis/rabbitmq, so the normal stack must be up first.
  api-pay:
    extends:
      file: docker-compose.yml
      service: api
    environment:
      PAYMENTS_ENABLED: "true"
      STRIPE_API_BASE_URL: ${STRIPE_API_BASE_URL:-}
    # !override replaces api's 8080 mapping; without it both bindings merge
    # and the second container fails to start.
    ports: !override
      - '${API_PAY_PORT:-127.0.0.1:8082}:8080'
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker-pay:
    extends:
      file: docker-compose.yml
      service: worker
    environment:
      PAYMENTS_ENABLED: "true"
      STRIPE_API_BASE_URL: ${STRIPE_API_BASE_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
