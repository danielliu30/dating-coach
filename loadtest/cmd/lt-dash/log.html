<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>dating-coach load test — terminal</title>
<style>
  body { margin: 0; background: #0d1117; }
  #term { font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
          color: #c9d1d9; white-space: pre-wrap; padding: 14px 18px; }
  .flag { color: #f85149; }
  .bar { position: sticky; top: 0; background: #161b22; color: #8b949e;
         font: 12px/1.4 ui-monospace, monospace; padding: 6px 18px;
         border-bottom: 1px solid #21262d; }
  a { color: #58a6ff; }
</style>
</head>
<body>
<div class="bar">terminal view — polling the run log every second · <a href="/">components table</a></div>
<pre id="term">loading…</pre>
<script>
const term = document.getElementById("term");
const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
// highlight flag-bearing progress lines
const paint = s => esc(s).replace(/flags=.*/g, m => `<span class="flag">${m}</span>`);
async function tick() {
  try {
    const r = await fetch("/api/log", {cache: "no-store"});
    if (!r.ok) return;
    const atBottom = Math.abs(window.innerHeight + window.scrollY - document.body.scrollHeight) < 60;
    term.innerHTML = paint(await r.text());
    if (atBottom) window.scrollTo(0, document.body.scrollHeight);
  } catch (e) {}
}
setInterval(tick, 1000);
tick();
</script>
</body>
</html>
