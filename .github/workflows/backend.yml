name: Backend (Go)

# Runs on every PR (required check). Deploys are handled by the
# dating-coach-infra repo pipelines via notify-infra.yml.
# `edited`/`ready_for_review` re-run it on stacked-PR base retargets and when a
# draft is marked ready. Path filters are deliberately absent: required checks
# must report on every pull request.
on:
  workflow_call:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

defaults:
  run:
    working-directory: backend

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: datingcoach
          POSTGRES_PASSWORD: datingcoach
          POSTGRES_DB: datingcoach
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U datingcoach -d datingcoach"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://datingcoach:datingcoach@localhost:5432/datingcoach?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go build ./...
      - run: go vet ./...
      - name: Apply migrations
        env:
          PGPASSWORD: datingcoach
        run: |
          for f in migrations/*.up.sql; do
            psql -v ON_ERROR_STOP=1 -h localhost -U datingcoach -d datingcoach -f "$f"
          done
      - run: go test -count=1 -p 1 ./...
