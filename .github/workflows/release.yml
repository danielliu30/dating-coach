name: Release (build, push, deploy)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: >-
          Deploy an already-published image tag (e.g. an older git SHA) instead of
          building this commit. Leave empty for a normal test -> build -> deploy run.
        required: false
        default: ""

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKERHUB_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}
  IMAGE_TAG: ${{ github.sha }}
  DEPLOY_TAG: ${{ inputs.image_tag || github.sha }}

jobs:
  # Never publish an image from a commit that fails any of the test workflows.
  backend:
    if: ${{ !inputs.image_tag }}
    uses: ./.github/workflows/backend.yml
  app:
    if: ${{ !inputs.image_tag }}
    uses: ./.github/workflows/app.yml
  ml-analyzer:
    if: ${{ !inputs.image_tag }}
    uses: ./.github/workflows/ml-analyzer.yml
  e2e:
    if: ${{ !inputs.image_tag }}
    uses: ./.github/workflows/e2e.yml

  build-push:
    if: ${{ !inputs.image_tag }}
    needs: [backend, app, ml-analyzer, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Same-origin web bundle: REST + chat WebSocket use the page's origin via nginx.
      WEB_API_URL: ""
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build images (tagged with the git SHA)
        run: docker compose --profile gateway build api ml-analyzer web

      - name: Push SHA tags
        run: docker compose --profile gateway push api ml-analyzer web

      # `latest` only ever points at the current tip of main: skip promotion for
      # manual runs on other refs, and when a newer main commit has already landed
      # (concurrency groups do not guarantee FIFO between queued runs).
      - name: Decide whether to promote latest
        id: promote
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "not main ($GITHUB_REF): SHA tags pushed, latest left untouched"; exit 0
          fi
          git fetch -q origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "main has moved past $GITHUB_SHA: latest left untouched"; exit 0
          fi
          echo "latest=true" >> "$GITHUB_OUTPUT"

      - name: Push latest tags
        if: steps.promote.outputs.latest == 'true'
        run: |
          for img in dating-coach-backend dating-coach-ml-analyzer dating-coach-web; do
            docker tag "$DOCKERHUB_NAMESPACE/$img:$IMAGE_TAG" "$DOCKERHUB_NAMESPACE/$img:latest"
          done
          IMAGE_TAG=latest docker compose --profile gateway push api ml-analyzer web

  # Push-based deploy: SSH into the production VM, pin IMAGE_TAG in its .env so
  # later manual `docker compose up` calls keep the same images, pull, up, and
  # if the health checks do not come back, revert to the previously pinned tag and fail the job.
  deploy:
    needs: [build-push]
    if: ${{ !cancelled() && (inputs.image_tag || needs.build-push.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.DEPLOY_HEALTHCHECK_URL }}
    steps:
      - uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DEPLOY_TAG,DEPLOY_DIR,DOCKERHUB_NAMESPACE,HEALTHCHECK_URL
          script: |
            set -euo pipefail
            cd "${DEPLOY_DIR:-$HOME/dating-coach}"
            test -f .env || { echo "production .env missing in $(pwd)"; exit 1; }
            git rev-parse --is-inside-work-tree >/dev/null 2>&1 || { echo "$(pwd) must be a git checkout of the repo"; exit 1; }
            export IMAGE_TAG="$DEPLOY_TAG" DOCKERHUB_NAMESPACE
            git fetch -q origin
            # preflight: pull with the target revision's compose file, before touching the checkout or .env,
            # so a missing tag or image leaves the VM untouched
            target_compose="$(mktemp)"; trap 'rm -f "$target_compose"' EXIT
            git show "$DEPLOY_TAG:docker-compose.yml" > "$target_compose"
            docker compose -f "$target_compose" --project-directory . --profile gateway pull api worker ml-analyzer web
            prev_tag="$(sed -n 's/^IMAGE_TAG=//p' .env | tail -n1)"
            prev_rev="$(git rev-parse HEAD)"
            healthy() {
              base="${HEALTHCHECK_URL:-http://localhost/healthz}"; base="${base%/healthz}"
              for i in $(seq 1 45); do
                if curl -fsS "$base/healthz" >/dev/null 2>&1 \
                  && curl -fsS "$base/ml/healthz" >/dev/null 2>&1 \
                  && curl -fsS -o /dev/null "$base/"; then
                  echo "$1: health checks OK after ${i} attempts"; return 0
                fi
                sleep 2
              done
              echo "$1: health checks failed"
              docker compose --profile gateway ps
              docker compose --profile gateway logs --no-color --tail 50 api ml-analyzer web migrate nginx
              return 1
            }
            pin() {
              # migrations and nginx config are bind-mounted from the checkout, so it must match the image
              git checkout -q --detach "$1"
              sed -i '/^IMAGE_TAG=/d;/^DOCKERHUB_NAMESPACE=/d' .env
              printf 'IMAGE_TAG=%s\nDOCKERHUB_NAMESPACE=%s\n' "$2" "$DOCKERHUB_NAMESPACE" >> .env
              IMAGE_TAG="$2" docker compose --profile gateway up -d --no-build
            }
            pin "$DEPLOY_TAG" "$DEPLOY_TAG"
            if healthy "deployed $DEPLOY_TAG"; then
              docker image prune -af --filter "until=168h" >/dev/null
              exit 0
            fi
            # roll back to what was running before; the job still fails so the bad release is visible
            if [ -z "$prev_tag" ]; then
              echo "no previous IMAGE_TAG in .env, leaving $DEPLOY_TAG in place for inspection"; exit 1
            fi
            echo "reverting to $prev_tag ($prev_rev)"
            pin "$prev_rev" "$prev_tag"
            healthy "reverted to $prev_tag" || echo "rollback to $prev_tag is also unhealthy"
            exit 1
        env:
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
          HEALTHCHECK_URL: ${{ vars.DEPLOY_HEALTHCHECK_URL }}
