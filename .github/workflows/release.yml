name: Release (build, push, deploy)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: >-
          Deploy an already-published image tag (e.g. an older git SHA) instead of
          building this commit. Leave empty for a normal test -> build -> deploy run.
        required: false
        default: ""

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKERHUB_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}
  IMAGE_TAG: ${{ github.sha }}
  DEPLOY_TAG: ${{ inputs.image_tag || github.sha }}

jobs:
  # Never publish an image from a commit that fails any of the test workflows.
  backend:
    if: ${{ !inputs.image_tag }}
    uses: ./.github/workflows/backend.yml
  app:
    if: ${{ !inputs.image_tag }}
    uses: ./.github/workflows/app.yml
  ml-analyzer:
    if: ${{ !inputs.image_tag }}
    uses: ./.github/workflows/ml-analyzer.yml
  e2e:
    if: ${{ !inputs.image_tag }}
    uses: ./.github/workflows/e2e.yml

  build-push:
    if: ${{ !inputs.image_tag }}
    needs: [backend, app, ml-analyzer, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The web bundle calls the API's own Cloud Run URL (cross-origin; see CORS_ORIGINS).
      WEB_API_URL: ${{ vars.API_PUBLIC_URL }}
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build images (tagged with the git SHA)
        run: docker compose --profile gateway build api ml-analyzer web migrate

      - name: Push SHA tags
        run: docker compose --profile gateway push api ml-analyzer web migrate

      # `latest` only ever points at the current tip of main: skip promotion for
      # manual runs on other refs, and when a newer main commit has already landed
      # (concurrency groups do not guarantee FIFO between queued runs).
      - name: Decide whether to promote latest
        id: promote
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "not main ($GITHUB_REF): SHA tags pushed, latest left untouched"; exit 0
          fi
          git fetch -q origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "main has moved past $GITHUB_SHA: latest left untouched"; exit 0
          fi
          echo "latest=true" >> "$GITHUB_OUTPUT"

      - name: Push latest tags
        if: steps.promote.outputs.latest == 'true'
        run: |
          for img in dating-coach-backend dating-coach-ml-analyzer dating-coach-web dating-coach-migrate; do
            docker tag "$DOCKERHUB_NAMESPACE/$img:$IMAGE_TAG" "$DOCKERHUB_NAMESPACE/$img:latest"
          done
          IMAGE_TAG=latest docker compose --profile gateway push api ml-analyzer web migrate

  # Production scaling is opt-in: SCALE_PROFILE=production only deploys after the
  # load test passes and someone approves the production-scale environment
  # (configure required reviewers on it). Otherwise the free starter profile is used.
  load-test:
    needs: [build-push]
    if: ${{ !cancelled() && vars.SCALE_PROFILE == 'production' && (inputs.image_tag || needs.build-push.result == 'success') }}
    uses: ./.github/workflows/load-test.yml
    with:
      api_url: ${{ vars.API_PUBLIC_URL }}
      image_tag: ${{ inputs.image_tag || github.sha }}

  scale-approval:
    needs: [load-test]
    if: ${{ !cancelled() && needs.load-test.result == 'success' }}
    runs-on: ubuntu-latest
    environment: production-scale
    steps:
      - run: echo "production scaling approved for ${{ inputs.image_tag || github.sha }}"

  # Deploy to Google Cloud Run (one service each for api, worker, ml-analyzer and
  # web; migrations as a Cloud Run job). Images are pulled straight from Docker
  # Hub. The worker is private and scales to zero: Pub/Sub pushes jobs to it and
  # Cloud Scheduler calls its /tasks endpoints. One-time setup:
  # scripts/gcp-bootstrap.sh and docs/deploy-cloud-run.md.
  # If the api or web health check fails, traffic goes back to the revisions
  # that served before this run and the job fails.
  deploy:
    needs: [build-push, scale-approval]
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' && (inputs.image_tag || needs.build-push.result == 'success')
      && (vars.SCALE_PROFILE != 'production' || needs.scale-approval.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
      url: ${{ vars.PUBLIC_APP_URL }}
    env:
      PROJECT: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION || 'us-central1' }}
      RUNTIME_SA: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
      WEB_SA: ${{ vars.GCP_WEB_SERVICE_ACCOUNT }}
      INVOKER_SA: ${{ vars.GCP_INVOKER_SERVICE_ACCOUNT }}
      IMAGES: docker.io/${{ secrets.DOCKERHUB_USERNAME }}
      PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL }}
      SCALE_PROFILE: ${{ vars.SCALE_PROFILE == 'production' && 'production' || 'starter' }}
      ANALYSIS_TOPIC: conversation.analysis
      DELETION_TOPIC: account.deletion
      EMAIL_TOPIC: email.outbox
      MAX_DELIVERY_ATTEMPTS: '5'
      PAYMENTS_ENABLED: 'false'
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Pick scaling profile
        run: |
          # starter: free tier, everything scales to zero. production: warm API and
          # web, higher ceilings (gated above). Any value can be overridden by a
          # repository variable of the same name.
          if [ "$SCALE_PROFILE" = production ]; then
            d=(2 20 10 10 1 10)
          else
            d=(0 2 2 2 0 2)
          fi
          names=(API_MIN_INSTANCES API_MAX_INSTANCES WORKER_MAX_INSTANCES ML_MAX_INSTANCES WEB_MIN_INSTANCES WEB_MAX_INSTANCES)
          overrides=("${{ vars.API_MIN_INSTANCES }}" "${{ vars.API_MAX_INSTANCES }}" "${{ vars.WORKER_MAX_INSTANCES }}"
                     "${{ vars.ML_MAX_INSTANCES }}" "${{ vars.WEB_MIN_INSTANCES }}" "${{ vars.WEB_MAX_INSTANCES }}")
          for i in "${!names[@]}"; do
            echo "${names[$i]}=${overrides[$i]:-${d[$i]}}" | tee -a "$GITHUB_ENV"
          done
          echo "deploying with the $SCALE_PROFILE profile"

      - name: Write service settings
        run: |
          set -euo pipefail
          num="$(gcloud projects describe "$PROJECT" --format='value(projectNumber)')"
          url() { echo "https://$1-$num.$REGION.run.app"; }
          echo "ML_URL=$(url dating-coach-ml)" >> "$GITHUB_ENV"
          echo "WORKER_URL=$(url dating-coach-worker)" >> "$GITHUB_ENV"
          echo "API_URL=$(url dating-coach-api)" >> "$GITHUB_ENV"
          echo "WEB_URL=$(url dating-coach-web)" >> "$GITHUB_ENV"
          app_url="${PUBLIC_APP_URL:-$(url dating-coach-web)}"
          # Non-secret backend settings shared by api and worker.
          cat > backend.env.yaml <<YAML
          APP_ENV: production
          QUEUE_BACKEND: pubsub
          TRUSTED_PROXY_HOPS: "1"
          TRUSTED_PROXY_CIDRS: "0.0.0.0/0,::/0"
          GCP_PROJECT_ID: "$PROJECT"
          ANALYSIS_QUEUE: "$ANALYSIS_TOPIC"
          ACCOUNT_DELETION_QUEUE: "$DELETION_TOPIC"
          EMAIL_OUTBOX_TOPIC: "$EMAIL_TOPIC"
          PUBSUB_MAX_DELIVERY_ATTEMPTS: "$MAX_DELIVERY_ATTEMPTS"
          ML_SERVICE_URL: "$(url dating-coach-ml)"
          ML_SERVICE_AUTH: google
          PUBLIC_APP_URL: "$app_url"
          CORS_ORIGINS: "$app_url"
          SMTP_HOST: "${{ vars.SMTP_HOST }}"
          SMTP_PORT: "${{ vars.SMTP_PORT || '587' }}"
          SMTP_USERNAME: "${{ vars.SMTP_USERNAME }}"
          MAIL_FROM: "${{ vars.MAIL_FROM }}"
          GOOGLE_CLIENT_ID: "${{ vars.GOOGLE_CLIENT_ID }}"
          PAYMENTS_ENABLED: "$PAYMENTS_ENABLED"
          YAML
          sed -i 's/^ *//' backend.env.yaml

      - name: Remember the revisions serving now (rollback target)
        id: previous
        run: |
          for svc in dating-coach-api dating-coach-web; do
            rev="$(gcloud run services describe "$svc" --project "$PROJECT" --region "$REGION" \
              --flatten='status.traffic[]' --filter='status.traffic.percent>0' \
              --format='csv[no-heading](status.traffic.revisionName,status.traffic.percent)' 2>/dev/null \
              | sed 's/,/=/g' | paste -sd, - || true)"
            echo "PREV_${svc//-/_}=$rev" >> "$GITHUB_ENV"
          done

      - name: Run migrations (Cloud Run job)
        run: |
          gcloud run jobs deploy dating-coach-migrate --project "$PROJECT" --region "$REGION" \
            --image "$IMAGES/dating-coach-migrate:$DEPLOY_TAG" \
            --service-account "$RUNTIME_SA" \
            --set-secrets DATABASE_URL=DATABASE_URL:latest \
            --max-retries 0 --task-timeout 10m \
            --execute-now --wait

      - name: Deploy ml-analyzer (private)
        run: |
          gcloud run deploy dating-coach-ml --project "$PROJECT" --region "$REGION" \
            --image "$IMAGES/dating-coach-ml-analyzer:$DEPLOY_TAG" \
            --service-account "$RUNTIME_SA" --no-allow-unauthenticated \
            --memory 1Gi --min-instances 0 --max-instances "$ML_MAX_INSTANCES" --timeout 120 \
            --set-env-vars "ML_BACKEND=llm,LLM_PROVIDER=${{ vars.LLM_PROVIDER || 'anthropic' }},LLM_MODEL=${{ vars.LLM_MODEL || 'claude-sonnet-4-5' }}" \
            --set-secrets LLM_API_KEY=LLM_API_KEY:latest
          gcloud run services update-traffic dating-coach-ml --project "$PROJECT" --region "$REGION" --to-latest

      - name: Deploy worker (private, push-driven)
        run: |
          gcloud run deploy dating-coach-worker --project "$PROJECT" --region "$REGION" \
            --image "$IMAGES/dating-coach-backend:$DEPLOY_TAG" --command worker \
            --service-account "$RUNTIME_SA" --no-allow-unauthenticated \
            --min-instances 0 --max-instances "$WORKER_MAX_INSTANCES" --timeout 600 \
            --env-vars-file backend.env.yaml \
            --set-secrets DATABASE_URL=DATABASE_URL:latest,REDIS_URL=REDIS_URL:latest,JWT_SECRET=JWT_SECRET:latest,SMTP_PASSWORD=SMTP_PASSWORD:latest
          gcloud run services update-traffic dating-coach-worker --project "$PROJECT" --region "$REGION" --to-latest

      - name: Point Pub/Sub push subscriptions and Cloud Scheduler at the worker
        run: |
          set -euo pipefail
          sub() { # topic, path
            name="$1.worker-push"
            args=(--push-endpoint "$WORKER_URL$2" --push-auth-service-account "$INVOKER_SA"
                  --push-auth-token-audience "$WORKER_URL"
                  --ack-deadline 600 --min-retry-delay 10s --max-retry-delay 600s
                  --expiration-period=never
                  --dead-letter-topic "$1.dlq" --max-delivery-attempts "$MAX_DELIVERY_ATTEMPTS")
            if gcloud pubsub subscriptions describe "$name" --project "$PROJECT" >/dev/null 2>&1; then
              gcloud pubsub subscriptions update "$name" --project "$PROJECT" "${args[@]}"
            else
              gcloud pubsub subscriptions create "$name" --project "$PROJECT" --topic "$1" "${args[@]}"
            fi
            gcloud pubsub subscriptions add-iam-policy-binding "$name" --project "$PROJECT" \
              --member "serviceAccount:service-$(gcloud projects describe "$PROJECT" --format='value(projectNumber)')@gcp-sa-pubsub.iam.gserviceaccount.com" \
              --role roles/pubsub.subscriber >/dev/null
          }
          sub "$ANALYSIS_TOPIC" /pubsub/analysis
          sub "$DELETION_TOPIC" /pubsub/account-deletion
          sub "$EMAIL_TOPIC" /pubsub/email-outbox
          # Two jobs cover every timed loop (Cloud Scheduler's free tier is 3 jobs).
          job() { # name, schedule, path
            args=(--location "$REGION" --schedule "$2" --time-zone UTC --uri "$WORKER_URL$3"
                  --http-method POST --oidc-service-account-email "$INVOKER_SA" --oidc-token-audience "$WORKER_URL"
                  --attempt-deadline 300s)
            if gcloud scheduler jobs describe "$1" --project "$PROJECT" --location "$REGION" >/dev/null 2>&1; then
              gcloud scheduler jobs update http "$1" --project "$PROJECT" "${args[@]}"
            else
              gcloud scheduler jobs create http "$1" --project "$PROJECT" "${args[@]}"
            fi
          }
          minute_batch='/tasks/batch?task=relay-emails&task=relay-deletions&task=expire-bookings&task=replay-revocations&task=check-email-outbox'
          if [ "$PAYMENTS_ENABLED" = true ]; then
            minute_batch+='&task=sweep-payments'
          fi
          job dating-coach-every-minute '* * * * *' "$minute_batch"
          job dating-coach-hourly '0 * * * *' '/tasks/batch?task=purge-refresh-tokens'

      - name: Deploy api (public)
        run: |
          gcloud run deploy dating-coach-api --project "$PROJECT" --region "$REGION" \
            --image "$IMAGES/dating-coach-backend:$DEPLOY_TAG" --command api \
            --tag release-check \
            --service-account "$RUNTIME_SA" --allow-unauthenticated \
            --min-instances "$API_MIN_INSTANCES" --max-instances "$API_MAX_INSTANCES" \
            --timeout 3600 --session-affinity \
            --env-vars-file backend.env.yaml \
            --set-secrets DATABASE_URL=DATABASE_URL:latest,REDIS_URL=REDIS_URL:latest,JWT_SECRET=JWT_SECRET:latest,SMTP_PASSWORD=SMTP_PASSWORD:latest
          gcloud run services update-traffic dating-coach-api --project "$PROJECT" --region "$REGION" --to-latest

      - name: Deploy web (public)
        run: |
          gcloud run deploy dating-coach-web --project "$PROJECT" --region "$REGION" \
            --image "$IMAGES/dating-coach-web:$DEPLOY_TAG" --port 80 \
            --tag release-check \
            --service-account "$WEB_SA" \
            --allow-unauthenticated --min-instances "$WEB_MIN_INSTANCES" --max-instances "$WEB_MAX_INSTANCES"
          gcloud run services update-traffic dating-coach-web --project "$PROJECT" --region "$REGION" --to-latest

      - name: Health check
        run: |
          revision_url() {
            gcloud run services describe "$1" --project "$PROJECT" --region "$REGION" \
              --flatten='status.traffic[]' --filter='status.traffic.tag=release-check' \
              --format='value(status.traffic.url)'
          }
          api_check="$(revision_url dating-coach-api)"
          web_check="$(revision_url dating-coach-web)"
          healthy() {
            for i in $(seq 1 30); do
              curl -fsS "$api_check/healthz" >/dev/null 2>&1 && curl -fsS -o /dev/null "$web_check/" && return 0
              sleep 4
            done
            return 1
          }
          if healthy; then echo "api and web healthy on $DEPLOY_TAG"; exit 0; fi
          echo "health checks failed for $DEPLOY_TAG"
          exit 1

      - name: Roll back public service traffic
        if: ${{ failure() && steps.previous.outcome == 'success' }}
        run: |
          failed=0
          for svc in dating-coach-api dating-coach-web; do
            var="PREV_${svc//-/_}"; prev="${!var}"
            if [ -n "$prev" ]; then
              echo "reverting $svc to $prev"
              gcloud run services update-traffic "$svc" --project "$PROJECT" --region "$REGION" --to-revisions "$prev" || failed=1
            fi
          done
          exit "$failed"
