name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: datingcoach
          POSTGRES_PASSWORD: datingcoach
          POSTGRES_DB: datingcoach
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U datingcoach -d datingcoach"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://datingcoach:datingcoach@localhost:5432/datingcoach?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Apply migrations
        env:
          PGPASSWORD: datingcoach
        run: |
          for f in migrations/*.up.sql; do
            psql -v ON_ERROR_STOP=1 -h localhost -U datingcoach -d datingcoach -f "$f"
          done
      - name: Test
        run: go test ./...

  app:
    name: App (Expo/TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Export web bundle
        run: npx expo export --platform web
        env:
          CI: 'true'
          EXPO_NO_TELEMETRY: '1'

  ml-analyzer:
    name: ML analyzer (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-analyzer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            ml-analyzer/requirements.txt
            ml-analyzer/requirements-dev.txt
      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Test
        run: pytest
