name: ML analyzer (Python)

# Runs on every PR (required check). Deploys are handled by the
# dating-coach-infra repo pipelines via notify-infra.yml.
on:
  workflow_call:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

defaults:
  run:
    working-directory: ml-analyzer

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest
