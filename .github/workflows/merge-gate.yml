name: Merge gate

# Fully automated PR lifecycle:
# - dependency-gate: required check; fails while the PR body declares
#   "Depends on / Merge after / Blocked by #N" against unmerged PRs.
#   Gate semantics are checked out from the BASE branch so a PR cannot weaken
#   its own gate.
# - merge-gate-tests: offline test harness for the gate scripts themselves
#   (required check; keeps the automation honest).
# - enable-auto-merge: marks every PR for auto-merge (merge commit) so a green,
#   unblocked PR merges with no human action.
# - cascade: when a PR merges, re-runs this gate on every open PR that declared
#   a dependency on it, and merges the new base into that branch so its full
#   check suite re-runs.
# Stacked PRs (child branched off the parent's head branch) additionally get
# their base retargeted to main by GitHub when the parent's branch is deleted
# after merge; that fires `edited`, which also re-runs everything here.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, closed]
  pull_request_target:
    types: [opened, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to re-check dependencies for
        required: true

jobs:
  dependency-gate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          sparse-checkout: scripts
          sparse-checkout-cone-mode: false
      - name: Check declared dependencies are merged
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ inputs.pr || github.event.pull_request.number }}
        run: bash scripts/dependency-gate.sh "$PR"
      # A dispatched re-check runs on main's tip, so its own check run would not
      # land on the target PR: post the result onto the PR head explicitly.
      - name: Report gate result onto the PR head
        if: >-
          always() && github.event_name == 'workflow_dispatch' &&
          (steps.gate.outcome == 'success' || steps.gate.outcome == 'failure')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ inputs.pr }}
          OUTCOME: ${{ steps.gate.outcome }}
        run: |
          [ "$OUTCOME" = success ] && c=success || c=failure
          sha=$(gh pr view "$PR" --json headRefOid --jq .headRefOid)
          gh api -X POST "repos/$GITHUB_REPOSITORY/check-runs" \
            -f name=dependency-gate -f head_sha="$sha" -f status=completed \
            -f conclusion="$c" -f "output[title]=dependency gate" \
            -f "output[summary]=manual re-check of PR #$PR"

  merge-gate-tests:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test-merge-gate.sh

  enable-auto-merge:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable auto-merge (merge commit)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$(gh pr view "$PR" --json isDraft --jq .isDraft)" = "true" ]; then
            echo "PR #$PR is a draft; auto-merge deferred until ready_for_review"; exit 0
          fi
          if [ "$(gh pr view "$PR" --json autoMergeRequest --jq 'if .autoMergeRequest then "on" else "off" end')" = "on" ]; then
            echo "auto-merge already enabled"; exit 0
          fi
          gh pr merge "$PR" --auto --merge

  cascade:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
          sparse-checkout-cone-mode: false
      - name: Re-check open PRs that depended on the merged PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGED: ${{ github.event.pull_request.number }}
        run: bash scripts/merge-cascade.sh "$MERGED"
