# Rolling single-node deployment via Docker Swarm:
#   docker stack deploy -c deploy/stack.yml dating-coach
#
# scripts/deploy-watch.sh drives the full sequence — build images from
# docker-compose.yml, run the migrate gate FIRST (swarm has no depends_on,
# so ordering lives in the script and fails closed), then stack deploy.
#
# Correctness model:
# - Stateless services (api, worker, ml-analyzer, web, nginx) roll
#   order=start-first behind a /healthz gate: a new task must serve before
#   the old one drains. Update failure rolls back automatically.
# - Stateful singletons (postgres, redis, rabbitmq) roll order=stop-first:
#   their data dirs are exclusive — two writers on one volume corrupts it.
#   Their rare restarts are the only downtime window.
# - init: true puts tini in front of the `sh -c '… | tee'` wrappers so the
#   roll's SIGTERM reaches the app for graceful drain instead of a SIGKILL.
# - Volumes are external refs to the compose-created ones, so the stack
#   adopts existing data with no migration.
# - Only nginx publishes a port (80, ingress). api/worker/ml-analyzer stay
#   on the attachable overlay — swarm host-mode ports can't bind loopback
#   only, and this keeps them off the LAN. Reach the api directly with:
#     docker run --rm --network dating-coach_appnet curlimages/curl \
#       http://api:8080/healthz
# - Dev tools (mailpit, pgadmin) stay in docker-compose.yml profiles and are
#   intentionally not deployed here.
# - api's WebSocket sessions live in process memory: a rolled task drops its
#   sockets; clients reconnect per the e2e resilience contract. Rolling
#   start-first keeps HTTP availability — it cannot preserve the sockets.

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-production}
  DATABASE_URL: postgres://${POSTGRES_USER:-datingcoach}:${POSTGRES_PASSWORD:-datingcoach}@postgres:5432/${POSTGRES_DB:-datingcoach}?sslmode=disable
  REDIS_URL: redis://redis:6379/0
  RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/
  JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
  JWT_TTL: ${JWT_TTL:-15m}
  PROFILE_SCORE_ENABLED: ${PROFILE_SCORE_ENABLED:-false}
  VERIFY_TOKEN_TTL: ${VERIFY_TOKEN_TTL:-30m}
  VERIFY_RESEND_COOLDOWN: ${VERIFY_RESEND_COOLDOWN:-1m}
  REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-720h}
  BCRYPT_COST: ${BCRYPT_COST:-12}
  AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-20}
  AUTH_RATE_WINDOW: ${AUTH_RATE_WINDOW:-1m}
  TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-127.0.0.0/8,::1/128,172.16.0.0/12}
  LOGIN_FAILURE_LIMIT: ${LOGIN_FAILURE_LIMIT:-10}
  LOGIN_FAILURE_WINDOW: ${LOGIN_FAILURE_WINDOW:-15m}
  ML_SERVICE_URL: http://ml-analyzer:8000
  ML_SERVICE_TIMEOUT: ${ML_SERVICE_TIMEOUT:-60s}
  ANALYSIS_QUEUE: ${ANALYSIS_QUEUE:-conversation.analysis}
  ACCOUNT_DELETION_QUEUE: ${ACCOUNT_DELETION_QUEUE:-account.deletion}
  DEAD_LETTER_ALERT_PERIOD: ${DEAD_LETTER_ALERT_PERIOD:-1m}
  PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:8081,http://localhost:19006}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_TIMEOUT: ${SMTP_TIMEOUT:-30s}
  SMTP_TLS: ${SMTP_TLS:-}
  MAIL_FROM: ${MAIL_FROM:-no-reply@datingcoach.local}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  PAYMENTS_ENABLED: ${PAYMENTS_ENABLED:-false}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  PAYMENT_HOLD_TTL: ${PAYMENT_HOLD_TTL:-15m}

# Rolling update for stateless services: start-first + health gate + auto
# rollback. monitor is how long swarm watches a rolled task before judging.
x-roll-stateless: &roll-stateless
  update_config:
    parallelism: 1
    order: start-first
    delay: 10s
    monitor: 60s
    failure_action: rollback
  rollback_config:
    parallelism: 1
    order: stop-first

# Single-writer data dirs must release the volume before the replacement
# mounts it — never start-first on a stateful singleton.
x-roll-stateful: &roll-stateful
  update_config:
    parallelism: 1
    order: stop-first
    failure_action: rollback

x-manager-only: &manager-only
  constraints: [node.role == manager]

services:
  postgres:
    image: dating-coach-postgres:latest
    networks: [appnet]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-datingcoach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-datingcoach}
      POSTGRES_DB: ${POSTGRES_DB:-datingcoach}
    volumes: ['postgres-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-datingcoach}']
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      replicas: 1
      <<: *roll-stateful
      placement: *manager-only

  redis:
    image: valkey/valkey:8-alpine
    networks: [appnet]
    command: ['valkey-server', '--appendonly', 'yes']
    volumes: ['redis-data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      replicas: 1
      <<: *roll-stateful
      placement: *manager-only

  rabbitmq:
    image: rabbitmq:3-management-alpine
    networks: [appnet]
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes: ['rabbitmq-data:/var/lib/rabbitmq']
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 10s
      retries: 10
    deploy:
      replicas: 1
      <<: *roll-stateful
      placement: *manager-only

  api:
    image: ${DOCKERHUB_NAMESPACE:-danielliu30}/dating-coach-backend:${IMAGE_TAG:-latest}
    networks: [appnet]
    command: ['sh', '-c', 'api 2>&1 | tee -a /logs/api.log']
    volumes: ['app-logs:/logs']
    environment:
      <<: *backend-env
      HTTP_ADDR: ':8080'
    init: true
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8080/healthz >/dev/null 2>&1 || exit 1']
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      replicas: 1
      <<: *roll-stateless
      placement: *manager-only

  worker:
    image: ${DOCKERHUB_NAMESPACE:-danielliu30}/dating-coach-backend:${IMAGE_TAG:-latest}
    networks: [appnet]
    command: ['sh', '-c', 'worker 2>&1 | tee -a /logs/worker.log']
    volumes: ['app-logs:/logs']
    environment:
      <<: *backend-env
      PORT: '8080'
    init: true
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8080/healthz >/dev/null 2>&1 || exit 1']
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      replicas: 1
      <<: *roll-stateless
      placement: *manager-only

  ml-analyzer:
    image: ${DOCKERHUB_NAMESPACE:-danielliu30}/dating-coach-ml-analyzer:${IMAGE_TAG:-latest}
    networks: [appnet]
    command: ['sh', '-c', 'uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000} --workers ${UVICORN_WORKERS:-1} 2>&1 | tee -a /logs/ml-analyzer.log']
    volumes: ['app-logs:/logs', 'ml-models:/models']
    environment:
      ML_BACKEND: ${ML_BACKEND:-llm}
      ML_PROFILE_EVIDENCE_ENABLED: ${ML_PROFILE_EVIDENCE_ENABLED:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-claude-sonnet-4-5}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-45}
      ML_SEGMENT_SIZE: ${ML_SEGMENT_SIZE:-6}
      ML_MODEL_DIR: ${ML_MODEL_DIR:-/models/segment-scorer}
      UVICORN_WORKERS: ${ML_UVICORN_WORKERS:-1}
    init: true
    healthcheck:
      test: ['CMD-SHELL', 'python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(\"http://localhost:8000/healthz\", timeout=5).status==200 else 1)"']
      interval: 10s
      timeout: 6s
      retries: 5
    deploy:
      replicas: 1
      <<: *roll-stateless
      placement: *manager-only

  web:
    image: ${DOCKERHUB_NAMESPACE:-danielliu30}/dating-coach-web:${IMAGE_TAG:-latest}
    networks: [appnet]
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1/ || exit 1']
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      replicas: 1
      <<: *roll-stateless
      placement: *manager-only

  nginx:
    image: nginx:1.27-alpine
    networks: [appnet]
    ports: ['${NGINX_PORT:-80}:80']
    volumes: ['app-logs:/logs:ro']
    configs:
      - source: nginx_default_conf
        target: /etc/nginx/conf.d/default.conf
      - source: metrics_dashboard_html
        target: /usr/share/nginx/html/metrics/dashboard.html
      - source: metrics_dashboard_js
        target: /usr/share/nginx/html/metrics/dashboard.js
    healthcheck:
      test: ['CMD-SHELL', 'nginx -t -q || exit 1']
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      replicas: 1
      <<: *roll-stateless
      placement: *manager-only

  # Container/service snapshotter feeding the metrics dashboard: appends
  # docker stats (per task) and service replica counts to
  # /logs/metrics-{stats,services}.jsonl every METRICS_INTERVAL seconds.
  # Socket is mounted read-only; rotation bounds the files.
  metrics:
    image: docker:cli
    networks: [appnet]
    volumes:
      - '/var/run/docker.sock:/var/run/docker.sock:ro'
      - 'app-logs:/logs'
    command:
      - 'sh'
      - '-c'
      - 'while true; do ts="$$(date -u +%Y-%m-%dT%H:%M:%SZ)"; docker stats --no-stream --format "{{json .}}" | sed "s/^{/{\"ts\":\"$$ts\",/" >> /logs/metrics-stats.jsonl; docker service ls --format "{{json .}}" 2>/dev/null | sed "s/^{/{\"ts\":\"$$ts\",/" >> /logs/metrics-services.jsonl; sleep $${METRICS_INTERVAL:-15}; done'
    healthcheck:
      test: ['CMD-SHELL', 'test -f /logs/metrics-stats.jsonl && [ $$(( $$(date +%s) - $$(date -r /logs/metrics-stats.jsonl +%s) )) -lt 60 ]']
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      replicas: 1
      <<: *roll-stateless
      placement: *manager-only

configs:
  nginx_default_conf:
    file: ../nginx/default.conf
  metrics_dashboard_html:
    file: ../nginx/metrics-dashboard.html
  metrics_dashboard_js:
    file: ../nginx/metrics-dashboard.js

# attachable so the migrate gate in deploy-watch.sh can `docker run` on it
# before rolling the app. External so the script can create it on first boot
# before the stack itself exists.
networks:
  appnet:
    external: true
    name: dating-coach_appnet

# External refs to the compose-created volumes: the stack adopts existing
# data (users, queues, models, logs) with no migration.
volumes:
  postgres-data:
    external: true
    name: dating-coach_postgres-data
  redis-data:
    external: true
    name: dating-coach_redis-data
  rabbitmq-data:
    external: true
    name: dating-coach_rabbitmq-data
  app-logs:
    external: true
    name: dating-coach_app-logs
  ml-models:
    external: true
    name: dating-coach_ml-models
