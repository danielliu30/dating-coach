# Static server for the exported Expo web bundle (single-page output).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The entry document is unversioned; always revalidate it so a deploy is
    # picked up on the next load.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.html;
    }

    # Hashed bundle assets are immutable. favicon.ico is unversioned, so it is
    # deliberately excluded and served with nginx defaults.
    location ~* \.(js|css|woff2?|ttf|png|jpg|svg)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
