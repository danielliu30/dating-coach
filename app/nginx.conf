# Static server for the exported Expo web bundle (single-page output).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: blob: https://images.unsplash.com; font-src 'self' data:; connect-src 'self' ws://$http_host wss://$http_host http://localhost:8080 ws://localhost:8080 https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; form-action 'self';" always;

    # The entry document is unversioned; always revalidate it so a deploy is
    # picked up on the next load.
    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: blob: https://images.unsplash.com; font-src 'self' data:; connect-src 'self' ws://$http_host wss://$http_host http://localhost:8080 ws://localhost:8080 https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; form-action 'self';" always;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.html;
    }

    # Hashed bundle assets are immutable. favicon.ico is unversioned, so it is
    # deliberately excluded and served with nginx defaults.
    location ~* \.(js|css|woff2?|ttf|png|jpg|svg)$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: blob: https://images.unsplash.com; font-src 'self' data:; connect-src 'self' ws://$http_host wss://$http_host http://localhost:8080 ws://localhost:8080 https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; form-action 'self';" always;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
