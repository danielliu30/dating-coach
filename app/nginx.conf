# Static server for the exported Expo web bundle (single-page output).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # Hashed bundle assets are immutable; index.html must always be revalidated.
    location ~* \.(js|css|woff2?|ttf|png|jpg|svg|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
