name: dating-coach

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-development}
  DATABASE_URL: postgres://${POSTGRES_USER:-datingcoach}:${POSTGRES_PASSWORD:-datingcoach}@postgres:5432/${POSTGRES_DB:-datingcoach}?sslmode=disable
  REDIS_URL: redis://redis:6379/0
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
  JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
  JWT_TTL: ${JWT_TTL:-15m}
  VERIFY_TOKEN_TTL: ${VERIFY_TOKEN_TTL:-30m}
  REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-720h}
  BCRYPT_COST: ${BCRYPT_COST:-12}
  AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-20}
  AUTH_RATE_WINDOW: ${AUTH_RATE_WINDOW:-1m}
  ML_SERVICE_URL: http://ml-analyzer:8000
  ML_SERVICE_TIMEOUT: ${ML_SERVICE_TIMEOUT:-60s}
  ANALYSIS_QUEUE: ${ANALYSIS_QUEUE:-conversation.analysis}
  ACCOUNT_DELETION_QUEUE: ${ACCOUNT_DELETION_QUEUE:-account.deletion}
  DEAD_LETTER_ALERT_PERIOD: ${DEAD_LETTER_ALERT_PERIOD:-1m}
  PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:8081,http://localhost:19006}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_TIMEOUT: ${SMTP_TIMEOUT:-30s}
  MAIL_FROM: ${MAIL_FROM:-no-reply@datingcoach.local}
  PAYMENTS_ENABLED: ${PAYMENTS_ENABLED:-false}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  PAYMENT_HOLD_TTL: ${PAYMENT_HOLD_TTL:-15m}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-datingcoach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-datingcoach}
      POSTGRES_DB: ${POSTGRES_DB:-datingcoach}
    ports: ['5432:5432']
    volumes: ['postgres-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-datingcoach}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports: ['5672:5672', '15672:15672']
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 10s
      retries: 10

  # Applies backend/migrations, then exits.
  migrate:
    image: migrate/migrate:v4.17.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes: ['./backend/migrations:/migrations:ro']
    command:
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER:-datingcoach}:${POSTGRES_PASSWORD:-datingcoach}@postgres:5432/${POSTGRES_DB:-datingcoach}?sslmode=disable
      - up

  api:
    image: ${DOCKERHUB_NAMESPACE:-danielliu30}/dating-coach-backend:${IMAGE_TAG:-latest}
    build: ./backend
    command: ['api']
    environment:
      <<: *backend-env
      HTTP_ADDR: ':8080'
    # Public traffic goes through nginx; this host mapping is only for local
    # tooling (Expo dev server, curl) that talks to the API directly.
    ports: ['8080:8080']
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    image: ${DOCKERHUB_NAMESPACE:-danielliu30}/dating-coach-backend:${IMAGE_TAG:-latest}
    build: ./backend
    command: ['worker']
    environment: *backend-env
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ml-analyzer:
        condition: service_started

  ml-analyzer:
    image: ${DOCKERHUB_NAMESPACE:-danielliu30}/dating-coach-ml-analyzer:${IMAGE_TAG:-latest}
    build: ./ml-analyzer
    environment:
      ML_BACKEND: ${ML_BACKEND:-llm}
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-claude-sonnet-4-5}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-45}
      ML_SEGMENT_SIZE: ${ML_SEGMENT_SIZE:-6}
      ML_MODEL_DIR: ${ML_MODEL_DIR:-/models/segment-scorer}
    ports: ['8000:8000']

  # Static Expo web bundle (`--profile gateway`). Empty EXPO_PUBLIC_API_URL =
  # same origin as the page, so REST and the chat WebSocket both go through
  # nginx. Published on ${WEB_PORT:-3000} only for a host-installed nginx.
  web:
    image: ${DOCKERHUB_NAMESPACE:-danielliu30}/dating-coach-web:${IMAGE_TAG:-latest}
    build:
      context: ./app
      args:
        EXPO_PUBLIC_API_URL: ${WEB_API_URL:-}
    profiles: ['gateway']
    ports: ['${WEB_PORT:-3000}:80']
    restart: unless-stopped

  # Optional public entrypoint (`--profile gateway`): / to web, /api and
  # /healthz to api, /ml/ to ml-analyzer. Skip it when a host nginx fronts the
  # stack (see nginx/host-site.conf).
  nginx:
    image: nginx:1.27-alpine
    profiles: ['gateway']
    ports: ['${NGINX_PORT:-80}:80']
    volumes: ['./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro']
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
      web:
        condition: service_started
      ml-analyzer:
        condition: service_started

  # Optional Postgres UI (`--profile tools`) on :5050.
  pgadmin:
    image: dpage/pgadmin4:9.17
    profiles: ['tools']
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports: ['5050:80']
    volumes: ['pgadmin-data:/var/lib/pgadmin']
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  pgadmin-data:
