<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dating-coach ops</title>
<style>
  body { font: 13px/1.4 ui-monospace, monospace; background: #111; color: #ddd; margin: 0; padding: 16px; }
  h1 { font-size: 15px; margin: 0 0 4px; }
  h2 { font-size: 13px; color: #8ab4f8; margin: 20px 0 8px; border-bottom: 1px solid #333; padding-bottom: 4px; }
  table { border-collapse: collapse; width: 100%; }
  td, th { text-align: left; padding: 3px 10px 3px 0; border-bottom: 1px solid #222; white-space: nowrap; }
  th { color: #888; font-weight: normal; }
  .ok { color: #7ee787; } .bad { color: #ff7b72; } .dim { color: #666; }
  .cards { display: flex; gap: 10px; flex-wrap: wrap; }
  .card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 6px; padding: 8px 12px; min-width: 130px; }
  .card .k { color: #888; font-size: 11px; } .card .v { font-size: 16px; }
  input { background: #1a1a1a; border: 1px solid #333; color: #ddd; padding: 5px 8px; width: 320px; font: inherit; }
  button { background: #264f78; color: #fff; border: 0; padding: 5px 12px; cursor: pointer; font: inherit; }
  canvas { vertical-align: middle; }
  #gate { display: none; margin-top: 20px; }
</style>
</head>
<body>
<h1>dating-coach <span class="dim">ops dashboard</span> <span id="ts" class="dim"></span></h1>
<div id="gate">admin token: <input id="tok" type="password" placeholder="paste admin JWT"> <button onclick="saveTok()">save</button><div id="gatemsg" class="bad"></div></div>
<div id="app" style="visibility:hidden">
<h2>services</h2><table id="services"></table>
<h2>containers (latest sample)</h2><table id="tasks"></table>
<h2>edge requests (since metering start)</h2><div id="stats" class="cards"></div>
<h2>deploy history</h2><table id="deploys"></table>
</div>
<script src="/metrics/dashboard.js"></script>
</body>
</html>
